name: Deploy staging Pages

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Verified full 40-character staging commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      STAGING_API_URL: https://staging-api.markab-lb.com
      STAGING_PAGES_PROJECT: markab-staging
    steps:
      - name: Check out deployment procedure
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate requested staging release
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin staging
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/staging

      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          path: release

      - name: Verify checked out source
        run: test "$(git -C release rev-parse HEAD)" = "$RELEASE_SHA"

      - uses: pnpm/action-setup@v4
        with:
          version: "11.15.0"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: release/pnpm-lock.yaml

      - name: Build matching staging frontend
        working-directory: release
        env:
          VITE_API_URL: ${{ env.STAGING_API_URL }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/web build
          printf '{"release_id":"%s"}\n' "$RELEASE_SHA" > apps/web/dist/public/release.json
          jq -e --arg sha "$RELEASE_SHA" '.release_id == $sha' apps/web/dist/public/release.json >/dev/null
          grep -RFl "$STAGING_API_URL" apps/web/dist/public/assets >/dev/null
          ! grep -RFl 'https://api.markab-lb.com' apps/web/dist/public/assets >/dev/null

      - name: Verify staging Pages project and deployment settings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$STAGING_PAGES_PROJECT" \
            | jq -e '.success == true and .result.name == "markab-staging" and .result.source.config.production_branch == "staging" and .result.source.config.production_deployments_enabled == false and .result.source.config.preview_deployment_setting == "none"' >/dev/null

      - name: Deploy matching frontend to staging Pages
        working-directory: release
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.150.0 pages deploy apps/web/dist/public \
            --project-name="$STAGING_PAGES_PROJECT" --branch=staging \
            --commit-hash="$RELEASE_SHA"

      - name: Verify staging Pages provenance and smoke
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 https://staging.markab-lb.com/ | grep -qi '<!doctype html>'
          curl -fsSL --max-time 20 https://staging.markab-lb.com/platform | grep -qi '<!doctype html>'
          curl -fsSL --max-time 20 https://staging.markab-lb.com/login | grep -qi '<!doctype html>'
          curl -fsS --max-time 20 "https://staging.markab-lb.com/release.json?release=$RELEASE_SHA" \
            | jq -e --arg sha "$RELEASE_SHA" '.release_id == $sha' >/dev/null
          curl -fsS --max-time 20 -D /tmp/markab-staging-api-headers \
            -H 'Origin: https://staging.markab-lb.com' \
            https://staging-api.markab-lb.com/api/readyz | jq -e '.status == "ok"' >/dev/null
          grep -qi '^access-control-allow-origin: https://staging.markab-lb.com' /tmp/markab-staging-api-headers
