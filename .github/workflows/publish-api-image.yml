name: Publish API image

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA to build and publish
        required: true
        default: 28f88fc501cb99ab1281436c6d341bc6040b6e45
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ahdevworker03/markab-api

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate requested release SHA
        id: requested
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full lowercase commit SHA." >&2
            exit 1
          fi
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.requested.outputs.sha }}
          fetch-depth: 0

      - name: Confirm checked out release
        id: source
        env:
          REQUESTED_SHA: ${{ steps.requested.outputs.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$REQUESTED_SHA"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.source.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          network=markab-image-verification
          database=markab-image-verification-db
          api=markab-image-verification-api

          cleanup() {
            docker rm -f "$api" "$database" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker pull "$IMAGE_REF"
          runtime_user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE_REF")"
          test -n "$runtime_user"
          test "$runtime_user" != root

          docker network create "$network"
          docker run -d --name "$database" --network "$network" --network-alias db \
            --health-cmd 'pg_isready -U verify -d verify' \
            --health-interval 2s --health-timeout 2s --health-retries 15 \
            -e POSTGRES_USER=verify -e POSTGRES_PASSWORD=verify-password \
            -e POSTGRES_DB=verify postgres:16-alpine

          until [ "$(docker inspect --format '{{.State.Health.Status}}' "$database")" = healthy ]; do
            sleep 2
          done

          docker run -d --name "$api" --network "$network" -p 127.0.0.1:3000:3000 \
            -e PORT=3000 -e NODE_ENV=production -e LOG_LEVEL=error \
            -e DATABASE_URL=postgresql://verify:verify-password@db:5432/verify?schema=public \
            -e JWT_SECRET=ci-jwt-secret-00000000000000000000000000000001 \
            -e REFRESH_TOKEN_SECRET=ci-refresh-secret-000000000000000000000000000001 \
            -e CORS_ORIGINS=https://ci.markab.invalid -e STORAGE_PROVIDER=r2 \
            -e R2_ACCOUNT_ID=ci-account -e R2_ACCESS_KEY_ID=ci-access-key \
            -e R2_SECRET_ACCESS_KEY=ci-secret-key -e R2_BUCKET=ci-bucket \
            -e RESEND_API_KEY=re_ci_token -e RESEND_FROM='CI <ci@markab.invalid>' \
            -e PASSWORD_RESET_FRONTEND_ORIGIN=https://ci.markab.invalid \
            -e PASSWORD_RESET_FRONTEND_PATH=/password-reset "$IMAGE_REF"

           until curl --fail --silent --show-error http://127.0.0.1:3000/api/healthz >/dev/null; do
             sleep 2
           done

           curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/api/readyz >/dev/null
           docker stop -t 15 "$database"
           ! curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/api/readyz >/dev/null
           docker stop -t 15 "$api"
           test "$(docker inspect --format '{{.State.ExitCode}}' "$api")" = 0

          image_size="$(docker image inspect --format '{{.Size}}' "$IMAGE_REF")"
          memory_usage="$(docker stats --no-stream --format '{{.MemUsage}}' "$api")"
          {
            echo '### Published API image'
            echo
            echo "- Source SHA: \\`${{ steps.source.outputs.sha }}\\`"
            echo "- Image: \\`$IMAGE_REF\\`"
            echo "- Runtime user: \\`$runtime_user\\`"
            echo "- Image size: \\`$image_size bytes\\`"
            echo "- Idle memory: \\`$memory_usage\\`"
          } >> "$GITHUB_STEP_SUMMARY"
