name: Publish API image

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA to build and verify
        required: true
        type: string
      verification_mode:
        description: Production publication requires approved main CI; candidate does not set the production image status
        required: true
        default: production
        type: choice
        options:
          - production
          - candidate

permissions:
  actions: read
  contents: read
  packages: write

env:
  IMAGE_NAME: ${{ inputs.verification_mode == 'candidate' && 'ghcr.io/ahdevworker03/markab-api-candidate' || 'ghcr.io/ahdevworker03/markab-api' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Validate requested release SHA
        id: requested
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full lowercase commit SHA." >&2
            exit 1
          fi
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.requested.outputs.sha }}
          fetch-depth: 0

      - name: Confirm checked out release
        id: source
        env:
          REQUESTED_SHA: ${{ steps.requested.outputs.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$REQUESTED_SHA"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

      - name: Require approved main commit and passing CI
        if: inputs.verification_mode == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$RELEASE_SHA" -f branch=main \
            | jq -e --arg sha "$RELEASE_SHA" \
              '.workflow_runs | map(select(.head_sha == $sha and .head_branch == "main")) | max_by(.created_at) | .conclusion == "success"' >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.source.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Block actionable high/critical API image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Verify published image
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          network=markab-image-verification
          database=markab-image-verification-db
          api=markab-image-verification-api

          cleanup() {
            docker rm -f "$api" "$database" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker pull "$IMAGE_REF"
          runtime_user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE_REF")"
          test -n "$runtime_user"
          test "$runtime_user" != root
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_REF")" = "${{ steps.source.outputs.sha }}"

          docker network create "$network"
          docker run -d --name "$database" --network "$network" --network-alias db \
            --health-cmd 'pg_isready -U verify -d verify' \
            --health-interval 2s --health-timeout 2s --health-retries 15 \
            -e POSTGRES_USER=verify -e POSTGRES_PASSWORD=verify-password \
            -e POSTGRES_DB=verify postgres:16-alpine

          until [ "$(docker inspect --format '{{.State.Health.Status}}' "$database")" = healthy ]; do
            sleep 2
          done

          docker run -d --name "$api" --network "$network" -p 127.0.0.1:3000:3000 \
            -e PORT=3000 -e NODE_ENV=production -e LOG_LEVEL=error \
            -e DATABASE_URL=postgresql://verify:verify-password@db:5432/verify?schema=public \
            -e JWT_SECRET=ci-jwt-secret-00000000000000000000000000000001 \
            -e REFRESH_TOKEN_SECRET=ci-refresh-secret-000000000000000000000000000001 \
            -e CORS_ORIGINS=https://ci.markab.invalid -e STORAGE_PROVIDER=r2 \
            -e R2_ACCOUNT_ID=ci-account -e R2_ACCESS_KEY_ID=ci-access-key \
            -e R2_SECRET_ACCESS_KEY=ci-secret-key -e R2_BUCKET=ci-bucket \
            -e RESEND_API_KEY=re_ci_token -e RESEND_FROM='CI <ci@markab.invalid>' \
            -e PASSWORD_RESET_FRONTEND_ORIGIN=https://ci.markab.invalid \
            -e PASSWORD_RESET_FRONTEND_PATH=/password-reset "$IMAGE_REF"

           until curl --fail --silent --show-error http://127.0.0.1:3000/api/healthz >/dev/null; do
             sleep 2
           done

           curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/api/readyz >/dev/null
           docker stop -t 15 "$database"
           ! curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/api/readyz >/dev/null
           docker stop -t 15 "$api"
           test "$(docker inspect --format '{{.State.ExitCode}}' "$api")" = 0

          image_size="$(docker image inspect --format '{{.Size}}' "$IMAGE_REF")"
          memory_usage="$(docker stats --no-stream --format '{{.MemUsage}}' "$api")"
          {
            echo '### ${{ inputs.verification_mode == 'candidate' && 'Candidate API image verification' || 'Published API image' }}'
            echo
            echo "- Source SHA: \\`${{ steps.source.outputs.sha }}\\`"
            echo "- Image: \\`$IMAGE_REF\\`"
            echo "- Runtime user: \\`$runtime_user\\`"
            echo "- Image size: \\`$image_size bytes\\`"
            echo "- Idle memory: \\`$memory_usage\\`"
          } >> "$GITHUB_STEP_SUMMARY"

  record-release:
    name: Record verified production image
    needs: publish
    if: inputs.verification_mode == 'production'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Record verified release image on commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.publish.outputs.source_sha }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SHA" \
            -f state=success -f context=markab/api-image \
            -f description="$IMAGE_DIGEST" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
