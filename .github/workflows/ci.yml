name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.15.0"

jobs:
  source:
    name: Verify requested source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate requested source SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
      - name: Confirm checked out source
        id: source
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$REQUESTED_SHA"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

  generated:
    name: Generated contracts
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vehicle_rental_test?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:generate
      - run: pnpm --filter @workspace/api-spec run codegen
      - run: git diff --exit-code

  api:
    name: API
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vehicle_rental_test?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vehicle_rental_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d vehicle_rental_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:generate
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/db exec prisma migrate deploy
      - run: pnpm --filter @workspace/db exec prisma migrate status
      - run: pnpm --filter @workspace/api-server test:migration
      - run: pnpm --filter @workspace/api-server test:backup-restore
      - run: pnpm --filter @workspace/api-server test
      - run: pnpm --filter @workspace/api-server typecheck
      - run: pnpm --filter @workspace/api-server lint
      - run: pnpm --filter @workspace/api-server build

  web:
    name: Web
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/web test
      - run: pnpm --filter @workspace/web typecheck
      - run: pnpm --filter @workspace/web build

  quality:
    name: Quality and security
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: git diff --check
      - name: Scan committed secrets without printing matches
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          format: json
          output: trivy-secrets.json
          exit-code: "0"
      - name: Block committed high/critical secrets
        run: |
          set -euo pipefail
          if jq -e 'any(.Results[]?; (.Secrets // []) | length > 0)' trivy-secrets.json >/dev/null; then
            jq -r '[.Results[]? | select((.Secrets // []) | length > 0) | "\(.Target): \([.Secrets[] | \"\(.RuleID) (\(.Severity))\"] | join(\", \"))"] | .[]' trivy-secrets.json
            exit 1
          fi
      - run: pnpm audit --prod
