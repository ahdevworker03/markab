            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rentals/{id}/contract/signed:
    get:
      operationId: listRentalContractSignedDocuments
      tags: [contracts]
      summary: List signed documents for a rental contract
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Rental ID
      responses:
        "200":
          description: List of signed documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Rental or contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: uploadRentalContractSignedDocument
      tags: [contracts]
      summary: Upload a signed contract document
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Rental ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Signed document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponseWrapper"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Rental or contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed or unsupported file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rentals/{id}/contract/signed/{documentId}:
    get:
      operationId: getRentalContractSignedDocument
      tags: [contracts]
      summary: Get a signed contract document
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Rental ID
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: Document ID
      responses:
        "200":
          description: Signed document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponseWrapper"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contract or document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRentalContractSignedDocument
      tags: [contracts]
      summary: Soft delete a signed contract document
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Rental ID
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: Document ID
      responses:
        "204":
          description: Document deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contract or document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rentals/{id}/contract/signed/{documentId}/download:
    get:
      operationId: downloadRentalContractSignedDocument
      tags: [contracts]
      summary: Download a signed contract document
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Rental ID
        - name: documentId
          in: path
          required: true
          schema:
            type: string
          description: Document ID
      responses:
        "200":
          description: Signed document download
          content:
