<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مَركب | إدارة تأجير المركبات</title>
    <meta name="description" content="مَركب: منصة عربية لإدارة عمليات تأجير المركبات." />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/png" href="/brand/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/icons/markab-app-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

  <body>
    <div id="root"></div>
    <script>
      try {
        if (localStorage.getItem('vehicle-rental-theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (_) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
