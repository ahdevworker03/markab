name: vehicle-rental-edge

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - markab-edge
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  markab-edge:
    name: markab-edge
    external: true
