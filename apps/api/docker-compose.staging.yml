name: vehicle-rental-staging

services:
  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    labels:
      org.opencontainers.image.revision: ${RELEASE_ID:?RELEASE_ID is required}
    environment:
      PORT: "3000"
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RELEASE_ID: ${RELEASE_ID:?RELEASE_ID is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      RESEND_FROM: ${RESEND_FROM:?RESEND_FROM is required}
      PASSWORD_RESET_FRONTEND_ORIGIN: ${PASSWORD_RESET_FRONTEND_ORIGIN:?PASSWORD_RESET_FRONTEND_ORIGIN is required}
      PASSWORD_RESET_FRONTEND_PATH: ${PASSWORD_RESET_FRONTEND_PATH:?PASSWORD_RESET_FRONTEND_PATH is required}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:?STORAGE_PROVIDER is required}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/readyz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    networks:
      markab-edge:
        aliases:
          - staging-api
      staging_data: {}
    restart: unless-stopped

  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    entrypoint: ["./scripts/migrate.sh"]
    profiles: ["migration"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MIGRATION_ENVIRONMENT: staging
      RELEASE_ID: ${RELEASE_ID:?RELEASE_ID is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - staging_data

  backup:
    image: ${API_IMAGE:?API_IMAGE is required}
    entrypoint: ["./scripts/backup.sh"]
    profiles: ["backup"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      BACKUP_ENVIRONMENT: staging
      RELEASE_ID: ${RELEASE_ID:?RELEASE_ID is required}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:?BACKUP_R2_BUCKET is required}
      BACKUP_R2_PREFIX: backups/staging
      BACKUP_R2_ENDPOINT: ${BACKUP_R2_ENDPOINT:?BACKUP_R2_ENDPOINT is required}
      BACKUP_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:?BACKUP_R2_ACCESS_KEY_ID is required}
      BACKUP_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:?BACKUP_R2_SECRET_ACCESS_KEY is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - staging_data
      - backup_egress

  restore:
    image: ${API_IMAGE:?API_IMAGE is required}
    entrypoint: ["./scripts/restore.sh"]
    profiles: ["recovery"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      RESTORE_ENVIRONMENT: staging
      RELEASE_ID: ${RELEASE_ID:?RELEASE_ID is required}
      RESTORE_DATABASE: ${RESTORE_DATABASE:-}
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:-}
      RESTORE_ADMIN_DATABASE_URL: ${RESTORE_ADMIN_DATABASE_URL:-}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:?BACKUP_R2_BUCKET is required}
      BACKUP_R2_PREFIX: backups/staging
      BACKUP_R2_ENDPOINT: ${BACKUP_R2_ENDPOINT:?BACKUP_R2_ENDPOINT is required}
      BACKUP_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:?BACKUP_R2_ACCESS_KEY_ID is required}
      BACKUP_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:?BACKUP_R2_SECRET_ACCESS_KEY is required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - staging_data
      - backup_egress

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - staging_data
    restart: unless-stopped

volumes:
  staging_pgdata:
    external: true
    name: vehicle-rental-staging_staging_pgdata

networks:
  markab-edge:
    name: markab-edge
    external: true
  staging_data:
    name: vehicle-rental-staging_staging_data
    internal: true
  backup_egress:
    name: vehicle-rental-staging_backup_egress
