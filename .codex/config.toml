[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_TOKEN"

[mcp_servers.playwright]
command = "npx"
args = [
  "@playwright/mcp@latest",
  "--executable-path",
  "/usr/bin/brave-browser"
]

[mcp_servers.shadcn]
command = "npx"
args = ["shadcn@latest", "mcp"]
enabled = true

[mcp_servers."21st"]
url = "https://21st.dev/api/mcp"
enabled = true

[mcp_servers.cloudflare]
url = "https://mcp.cloudflare.com/mcp"
enabled = true

[mcp_servers.postgresql]
command = "npx"
args = [
  "-y",
  "@modelcontextprotocol/server-postgres",
  "postgresql://postgres:postgres@localhost:5432/vehicle_rental",
]
enabled = true

[mcp_servers.docker]
command = "npx"
args = ["-y", "@alisaitteke/docker-mcp"]
enabled = true

[mcp_servers.contabo]
command = "npx"
args = ["-y", "@kieksme/contabo-mcp"]
enabled = true

[mcp_servers.contabo.env]
CONTABO_CLIENT_ID = "${env:CONTABO_CLIENT_ID}"
CONTABO_CLIENT_SECRET = "${env:CONTABO_CLIENT_SECRET}"
CONTABO_API_USER = "${env:CONTABO_API_USER}"
CONTABO_API_PASSWORD = "${env:CONTABO_API_PASSWORD}"

[mcp_servers.openapi]
command = "uvx"
args = ["awslabs.openapi-mcp-server@latest"]

[mcp_servers.openapi.env]
API_NAME = "vehicle-rental-api"
API_BASE_URL = "http://localhost:3000/api"
API_SPEC_PATH = "lib/api-spec/openapi.yaml"
LOG_LEVEL = "ERROR"
ENABLE_OPERATION_PROMPTS = "true"
ALLOW_INSECURE_HTTP = "true"
ALLOW_PRIVATE_NETWORKS = "true"

[mcp_servers.playwright.tools.browser_navigate]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_fill_form]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_click]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_tabs]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_select_option]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_resize]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_run_code_unsafe]
approval_mode = "approve"
